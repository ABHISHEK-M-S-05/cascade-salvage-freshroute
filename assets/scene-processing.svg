<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300">
  <!-- CASCADE SALVAGE artwork: illustrative salvage line, blanch, quench, freeze (original SVG) -->
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcf7a"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ff0ff"/><stop offset="1" stop-color="#2ccbe6"/></linearGradient>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8dff"/><stop offset="1" stop-color="#2440a8"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d7e6"/><stop offset="1" stop-color="#7d93ad"/></linearGradient>
    <linearGradient id="belt" x1="0" x2="1"><stop offset="0" stop-color="#ffb260"/><stop offset=".45" stop-color="#5ee3f5"/><stop offset="1" stop-color="#3d5bd8"/></linearGradient>
    <g id="leaf"><path d="M0 0 C-10 -8 -6 -20 6 -22 C12 -12 8 -4 0 0Z" fill="#2fbf68"/><path d="M0 0 C2 -8 4 -14 6 -20" stroke="#bff5d2" stroke-width="1.2" fill="none"/></g>
  </defs>
  <!-- conveyor -->
  <rect x="20" y="226" width="860" height="14" rx="7" fill="url(#belt)"/>
  <g fill="#0b1a33"><circle cx="40" cy="250" r="9"/><circle cx="240" cy="250" r="9"/><circle cx="440" cy="250" r="9"/><circle cx="640" cy="250" r="9"/><circle cx="860" cy="250" r="9"/></g>
  <!-- incoming greens -->
  <use href="#leaf" transform="translate(52 226)"/><use href="#leaf" transform="translate(72 226) scale(.9)"/>
  <!-- blanch tank -->
  <g transform="translate(110 120)">
    <rect width="190" height="104" rx="10" fill="url(#steel)"/>
    <rect x="10" y="26" width="170" height="70" rx="6" fill="url(#hot)"/>
    <path d="M24 40 c6 -8 12 8 18 0 s12 8 18 0 s12 8 18 0 s12 8 18 0 s12 8 18 0 s12 8 18 0 s12 8 18 0" stroke="#fff4dc" stroke-width="2.5" fill="none" opacity=".8"/>
    <circle cx="44" cy="70" r="5" fill="#fff4dc" opacity=".6"/><circle cx="100" cy="80" r="4" fill="#fff4dc" opacity=".6"/><circle cx="150" cy="64" r="5" fill="#fff4dc" opacity=".6"/>
    <path d="M40 18 c-10 -16 10 -22 0 -40 M96 16 c-10 -16 10 -22 0 -40 M152 18 c-10 -16 10 -22 0 -40" stroke="#ffe2b0" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55"/>
  </g>
  <!-- quench tank -->
  <g transform="translate(340 132)">
    <rect width="170" height="92" rx="10" fill="url(#steel)"/>
    <rect x="10" y="22" width="150" height="62" rx="6" fill="url(#cool)"/>
    <path d="M30 44 l14 -8 l14 8 l-14 8Z M92 58 l12 -7 l12 7 l-12 7Z M122 38 l10 -6 l10 6 l-10 6Z" fill="#ffffff" opacity=".75"/>
    <use href="#leaf" transform="translate(70 70) rotate(-20)"/>
  </g>
  <!-- spiral freezer tunnel -->
  <g transform="translate(550 70)">
    <rect width="300" height="154" rx="16" fill="url(#cold)"/>
    <rect x="16" y="18" width="268" height="118" rx="10" fill="#14246b" opacity=".6"/>
    <path d="M30 120 C80 100 220 100 270 120 M30 90 C80 70 220 70 270 90 M30 60 C80 40 220 40 270 60" stroke="#8fb0ff" stroke-width="5" fill="none" opacity=".6"/>
    <g transform="translate(150 80)" stroke="#e8f1ff" stroke-width="5" stroke-linecap="round">
      <path d="M0 -30v60M-26 -15l52 30M-26 15l52 -30"/>
      <path d="M-6 -24l6 6l6 -6M-6 24l6 -6l6 6" fill="none" stroke-width="3.5"/>
    </g>
    <path d="M0 16 C20 4 40 20 60 8 C80 -2 100 16 120 6 C140 -2 160 14 180 6 C200 -2 220 14 240 6 C260 -2 280 12 300 4 L300 0 L0 0Z" fill="#e8f1ff" opacity=".85"/>
  </g>
  <use href="#leaf" transform="translate(860 226)"/>
</svg>
