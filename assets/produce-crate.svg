<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230">
  <!-- CASCADE SALVAGE artwork: frosted crate of Nashik produce (original, hand-built SVG) -->
  <defs>
    <radialGradient id="tom" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a74"/><stop offset=".6" stop-color="#f2402f"/><stop offset="1" stop-color="#b81f1a"/></radialGradient>
    <radialGradient id="oni" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e57aa6"/><stop offset=".6" stop-color="#b5306a"/><stop offset="1" stop-color="#7a1846"/></radialGradient>
    <linearGradient id="ban" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset="1" stop-color="#f2b81f"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#74e08f"/><stop offset="1" stop-color="#1f9a4b"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fcf74"/><stop offset="1" stop-color="#127a3d"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2a464"/><stop offset="1" stop-color="#a8652f"/></linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c5a27"/><stop offset="1" stop-color="#6e3b16"/></linearGradient>
    <g id="tomato">
      <circle r="22" fill="url(#tom)"/>
      <path d="M0 -20 l5 -6 l2 7 l8 -1 l-6 5 l5 6 l-8 -2 l-6 5 l-1 -7 l-8 2 l5 -6 l-6 -5 l8 0Z" fill="#2fa451"/>
      <ellipse cx="-8" cy="-8" rx="6" ry="4" fill="#fff" opacity=".35" transform="rotate(-30)"/>
    </g>
    <g id="onion">
      <path d="M0 -28 C4 -18 22 -10 22 6 C22 20 12 26 0 26 C-12 26 -22 20 -22 6 C-22 -10 -4 -18 0 -28Z" fill="url(#oni)"/>
      <path d="M0 -24 C-4 -8 -6 10 -2 24 M8 -16 C12 0 12 12 8 22" stroke="#f3a5c6" stroke-width="1.6" fill="none" opacity=".6"/>
    </g>
  </defs>

  <ellipse cx="160" cy="218" rx="140" ry="10" fill="#020611" opacity=".45"/>
  <!-- back rim of crate -->
  <path d="M30 96 L290 96 L280 112 L40 112Z" fill="url(#woodDark)"/>

  <!-- produce pile -->
  <g>
    <!-- spinach leaves -->
    <path d="M58 104 C40 70 52 44 78 40 C96 60 92 86 72 106Z" fill="url(#leaf)"/>
    <path d="M78 42 C80 64 78 86 72 104" stroke="#a8f0c0" stroke-width="2" fill="none" opacity=".7"/>
    <path d="M86 104 C80 74 96 54 118 56 C126 78 114 96 96 108Z" fill="url(#leaf)"/>
    <!-- banana bunch -->
    <path d="M196 70 C224 60 258 66 276 88 C262 84 236 80 208 88Z" fill="url(#ban)"/>
    <path d="M190 82 C222 74 254 82 270 104 C254 98 228 94 200 100Z" fill="url(#ban)"/>
    <path d="M196 70 l-10 -6 l4 14Z" fill="#6b4a1e"/>
    <path d="M276 88 l6 2 l-3 4Z M270 104 l6 1 l-3 4Z" fill="#5a3a15"/>
    <!-- capsicum -->
    <path d="M140 60 C160 56 176 66 176 86 C176 104 166 112 156 110 C150 116 140 116 134 110 C122 112 116 100 118 86 C120 70 128 62 140 60Z" fill="url(#cap)"/>
    <path d="M146 60 C146 52 150 46 158 44" stroke="#2c7a3a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M130 74 C128 84 128 94 132 102" stroke="#c4f5cf" stroke-width="3" stroke-linecap="round" fill="none" opacity=".6"/>
    <use href="#tomato" transform="translate(110 92)"/>
    <use href="#tomato" transform="translate(152 98) scale(.95)"/>
    <use href="#onion" transform="translate(196 100) scale(.9)"/>
    <use href="#tomato" transform="translate(236 102) scale(.9)"/>
    <use href="#onion" transform="translate(70 104) scale(.8)"/>
  </g>

  <!-- crate front -->
  <path d="M24 106 L296 106 L284 208 L36 208Z" fill="url(#wood)"/>
  <path d="M30 140 L290 140 M33 172 L287 172" stroke="#8a4f22" stroke-width="3" opacity=".55"/>
  <path d="M24 106 L296 106 L294 120 L26 120Z" fill="#f0b877"/>
  <rect x="40" y="108" width="12" height="100" fill="#8a4f22" opacity=".35"/>
  <rect x="268" y="108" width="12" height="100" fill="#8a4f22" opacity=".35"/>
  <!-- tag -->
  <g transform="translate(132 148)">
    <rect width="56" height="34" rx="4" fill="#f5efe1"/>
    <rect x="5" y="9" width="30" height="4" rx="2" fill="#2a3a5e"/>
    <rect x="5" y="18" width="44" height="3" rx="1.5" fill="#9aa8bf"/>
    <rect x="5" y="25" width="22" height="3" rx="1.5" fill="#9aa8bf"/>
  </g>
  <!-- frost on the rim -->
  <path d="M24 106 C60 98 90 104 120 100 C160 95 200 104 240 99 C266 96 286 100 296 106 L296 112 L24 112Z" fill="#eaf7ff" opacity=".9"/>
  <g fill="#ffffff" opacity=".8">
    <circle cx="60" cy="130" r="1.6"/><circle cx="92" cy="158" r="1.2"/><circle cx="224" cy="128" r="1.5"/><circle cx="252" cy="186" r="1.2"/><circle cx="120" cy="194" r="1.4"/><circle cx="210" cy="164" r="1.1"/>
  </g>
</svg>
