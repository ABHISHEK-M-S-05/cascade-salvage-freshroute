<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- CASCADE SALVAGE artwork: conventional dispatch stops at the first "no" (original SVG) -->
  <defs>
    <radialGradient id="disc" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#2a2340"/><stop offset="1" stop-color="#0d1427"/></radialGradient>
    <linearGradient id="store" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f2fa"/><stop offset="1" stop-color="#b9cfe2"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fc9ee"/><stop offset="1" stop-color="#2a6fae"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d79a5c"/><stop offset="1" stop-color="#9a5c2b"/></linearGradient>
    <linearGradient id="bin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55607a"/><stop offset="1" stop-color="#2c3448"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9e6f0"/><stop offset="1" stop-color="#9db4c8"/></linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff7461" stop-opacity=".45"/><stop offset="1" stop-color="#ff7461" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="320" cy="250" r="226" fill="url(#disc)"/>
  <circle cx="320" cy="250" r="226" fill="none" stroke="#ff7461" stroke-opacity=".18" stroke-width="2"/>
  <path d="M110 372 C200 350 440 350 530 372 C520 412 430 440 320 440 C210 440 120 412 110 372Z" fill="url(#ground)"/>

  <!-- premium store -->
  <rect x="140" y="190" width="220" height="182" rx="6" fill="url(#store)"/>
  <rect x="132" y="176" width="236" height="26" rx="5" fill="#3d7bff"/>
  <path d="M132 202 h236 l-8 22 h-220Z" fill="#2b5fd1"/>
  <path d="M152 202 l-6 22 M184 202 l-4 22 M216 202 l-2 22 M248 202 v22 M280 202 l2 22 M312 202 l4 22 M344 202 l6 22" stroke="#e8f2fa" stroke-width="6" opacity=".85"/>
  <rect x="160" y="236" width="80" height="136" rx="3" fill="url(#glass)"/>
  <rect x="258" y="236" width="84" height="70" rx="3" fill="url(#glass)"/>
  <path d="M170 250 l40 60 M262 246 l30 40" stroke="#d6f3ff" stroke-width="5" stroke-linecap="round" opacity=".45"/>
  <!-- barrier -->
  <rect x="150" y="300" width="100" height="10" rx="5" fill="#ff7461"/>
  <path d="M160 300 l10 10 M180 300 l10 10 M200 300 l10 10 M220 300 l10 10" stroke="#fff" stroke-width="5" opacity=".9"/>
  <rect x="156" y="310" width="6" height="62" fill="#c6d3df"/><rect x="238" y="310" width="6" height="62" fill="#c6d3df"/>
  <!-- snow on roof -->
  <path d="M132 178 C180 166 240 170 300 166 C330 164 356 168 368 178Z" fill="#ffffff"/>

  <!-- rejected crate -->
  <g transform="translate(372 300)">
    <ellipse cx="34" cy="20" rx="60" ry="40" fill="url(#warm)"/>
    <rect width="68" height="42" rx="3" fill="url(#wood)"/>
    <path d="M0 14h68M0 28h68" stroke="#7a4520" stroke-width="2" opacity=".5"/>
    <circle cx="14" cy="-4" r="9" fill="#9b4a2e"/><circle cx="32" cy="-6" r="10" fill="#b0532f"/><circle cx="50" cy="-4" r="9" fill="#8c4128"/>
    <g transform="translate(34 18)" stroke="#ff7461" stroke-width="7" stroke-linecap="round"><path d="M-14 -14 L14 14 M14 -14 L-14 14"/></g>
  </g>
  <!-- arrow to bin -->
  <path d="M446 300 C470 270 500 270 512 296" fill="none" stroke="#ff9a8a" stroke-width="4" stroke-dasharray="7 8" stroke-linecap="round"/>
  <path d="M504 288 l10 10 l4 -14Z" fill="#ff9a8a"/>
  <!-- waste bin -->
  <path d="M478 316 L546 316 L538 382 L486 382Z" fill="url(#bin)"/>
  <rect x="472" y="306" width="80" height="12" rx="4" fill="#6b7590"/>
  <path d="M494 330 v40 M512 330 v40 M530 330 v40" stroke="#1d2333" stroke-width="3" opacity=".6"/>
  <circle cx="496" cy="304" r="7" fill="#7b4a2c"/><circle cx="514" cy="300" r="8" fill="#5f3a22"/><circle cx="532" cy="305" r="6" fill="#6e4429"/>
  <!-- shelf-life clock running out -->
  <g transform="translate(470 140)">
    <circle r="34" fill="#0b1426" stroke="#ff7461" stroke-width="3"/>
    <circle r="34" fill="none" stroke="#ff7461" stroke-width="7" stroke-dasharray="20 300" transform="rotate(-90)" stroke-linecap="round"/>
    <path d="M0 0 L0 -22" stroke="#eaf6ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0 L-14 -12" stroke="#ff7461" stroke-width="3.5" stroke-linecap="round"/>
    <circle r="4" fill="#eaf6ff"/>
  </g>
</svg>
