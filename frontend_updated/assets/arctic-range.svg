<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice">
  <!-- CASCADE SALVAGE artwork: glacial mountain range (original, hand-built SVG) -->
  <defs>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4f86"/><stop offset="1" stop-color="#1a2852"/>
    </linearGradient>
    <linearGradient id="litFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe6fb"/><stop offset=".55" stop-color="#7ab8e0"/><stop offset="1" stop-color="#4b86bb"/>
    </linearGradient>
    <linearGradient id="shadeFace" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6ea6"/><stop offset="1" stop-color="#1c3766"/>
    </linearGradient>
    <linearGradient id="snowField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f3fc"/><stop offset="1" stop-color="#9cc6e3"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a33" stop-opacity="0"/><stop offset="1" stop-color="#0b1a33" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <!-- far range -->
  <path d="M0 360 L90 300 L170 330 L260 250 L340 300 L430 230 L520 290 L610 240 L700 300 L790 210 L880 280 L960 235 L1050 290 L1140 220 L1230 280 L1320 240 L1410 300 L1500 250 L1600 300 V600 H0Z" fill="url(#far)" opacity=".85"/>
  <path d="M260 250 L290 268 L276 270 L300 285 L250 262Z M430 230 L462 252 L446 254 L470 268 L420 244Z M790 210 L826 236 L808 238 L836 256 L780 228Z M1140 220 L1174 244 L1158 246 L1184 262 L1130 238Z" fill="#c9e3f7" opacity=".55"/>

  <!-- main glacial peaks: lit face + shaded face + snow cap -->
  <g>
    <path d="M120 600 L360 230 L470 600Z" fill="url(#litFace)"/>
    <path d="M360 230 L470 600 L600 600Z" fill="url(#shadeFace)"/>
    <path d="M360 230 L318 296 L344 288 L352 316 L372 284 L394 300 L388 272Z" fill="#f4fbff"/>

    <path d="M520 600 L820 150 L930 600Z" fill="url(#litFace)"/>
    <path d="M820 150 L930 600 L1110 600Z" fill="url(#shadeFace)"/>
    <path d="M820 150 L770 226 L800 214 L808 252 L834 212 L862 236 L852 200Z" fill="#f7fcff"/>
    <path d="M820 150 L842 420 L930 600" fill="none" stroke="#d7f0ff" stroke-width="2" opacity=".35"/>

    <path d="M1000 600 L1240 260 L1330 600Z" fill="url(#litFace)"/>
    <path d="M1240 260 L1330 600 L1480 600Z" fill="url(#shadeFace)"/>
    <path d="M1240 260 L1204 316 L1228 308 L1234 336 L1254 304 L1276 322 L1268 292Z" fill="#f4fbff"/>

    <path d="M-40 600 L80 380 L160 600Z" fill="url(#shadeFace)" opacity=".9"/>
    <path d="M1420 600 L1540 360 L1640 600Z" fill="url(#litFace)" opacity=".9"/>
  </g>

  <!-- rolling snow fields -->
  <path d="M0 470 C180 430 330 455 480 440 C640 425 760 470 930 455 C1100 440 1240 420 1400 445 C1500 460 1560 450 1600 445 V600 H0Z" fill="url(#snowField)"/>
  <path d="M0 520 C220 495 380 515 560 505 C760 494 900 525 1100 512 C1300 500 1450 520 1600 510 V600 H0Z" fill="#cfe6f6"/>
  <path d="M0 470 C180 430 330 455 480 440" fill="none" stroke="#ffffff" stroke-width="2" opacity=".6"/>
  <rect width="1600" height="600" fill="url(#mist)"/>
</svg>
