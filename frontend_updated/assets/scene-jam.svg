<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- CASCADE SALVAGE artwork: highway jam and a re-planned route (original SVG) -->
  <defs>
    <radialGradient id="disc" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#1a3a66"/><stop offset="1" stop-color="#0a1830"/></radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a68"/><stop offset="1" stop-color="#232e45"/></linearGradient>
    <linearGradient id="snowL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f3fb"/><stop offset="1" stop-color="#a9cbe3"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6fbff"/><stop offset="1" stop-color="#c9dcec"/></linearGradient>
    <g id="truck">
      <rect x="0" y="0" width="92" height="46" rx="4" fill="url(#box)"/>
      <rect x="0" y="30" width="92" height="6" fill="#2ccbe6"/>
      <g transform="translate(46 16)" stroke="#2ccbe6" stroke-width="2.4" stroke-linecap="round"><path d="M0 -8v16M-7 -4l14 8M-7 4l14 -8"/></g>
      <path d="M92 12 h22 l14 16 v18 h-36Z" fill="#3d7bff"/>
      <path d="M98 16 h14 l9 11 h-23Z" fill="#b8e4fb"/>
      <rect x="-4" y="44" width="134" height="6" rx="3" fill="#1a2238"/>
      <circle cx="20" cy="52" r="9" fill="#141a2b"/><circle cx="20" cy="52" r="3.5" fill="#8fa2bf"/>
      <circle cx="74" cy="52" r="9" fill="#141a2b"/><circle cx="74" cy="52" r="3.5" fill="#8fa2bf"/>
      <circle cx="112" cy="52" r="9" fill="#141a2b"/><circle cx="112" cy="52" r="3.5" fill="#8fa2bf"/>
      <circle cx="-2" cy="20" r="4" fill="#ff7461"/>
    </g>
  </defs>
  <circle cx="320" cy="250" r="226" fill="url(#disc)"/>
  <circle cx="320" cy="250" r="226" fill="none" stroke="#ff7461" stroke-opacity=".2" stroke-width="2"/>
  <!-- snow fields -->
  <path d="M96 300 C200 270 440 270 544 300 L540 360 C460 430 180 430 100 360Z" fill="url(#snowL)"/>
  <!-- highway in perspective -->
  <path d="M286 170 L354 170 L520 420 L120 420Z" fill="url(#road)"/>
  <path d="M320 176 L320 196 M320 214 L320 240 M320 262 L320 296 M320 322 L320 368 M320 392 L320 420" stroke="#ffbe55" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  <!-- distant trucks (queue) -->
  <use href="#truck" transform="translate(300 190) scale(.32)"/>
  <use href="#truck" transform="translate(286 222) scale(.45)"/>
  <use href="#truck" transform="translate(264 266) scale(.62)"/>
  <!-- front truck -->
  <use href="#truck" transform="translate(222 326) scale(.95)"/>
  <!-- hazard glow -->
  <circle cx="220" cy="345" r="18" fill="#ff7461" opacity=".25"/>
  <!-- warning sign -->
  <g transform="translate(470 196)">
    <rect x="-4" y="40" width="8" height="70" fill="#9fb3c8"/>
    <path d="M0 -36 L42 40 L-42 40Z" fill="#ffbe55" stroke="#0b1a33" stroke-width="4" stroke-linejoin="round"/>
    <text x="0" y="28" font-family="sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#0b1a33">+6h</text>
  </g>
  <!-- re-planned route -->
  <path d="M190 300 C130 280 112 220 150 180 C176 154 214 150 240 132" fill="none" stroke="#5ee3f5" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"/>
  <path d="M232 124 l16 4 l-8 14Z" fill="#5ee3f5"/>
  <g transform="translate(266 120)">
    <circle r="22" fill="#0b1a33" stroke="#5ee3f5" stroke-width="3"/>
    <path d="M-9 1 l6 6 l12 -13" fill="none" stroke="#5ee3f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#ffffff" opacity=".7"><circle cx="160" cy="130" r="2.5"/><circle cx="430" cy="110" r="2"/><circle cx="540" cy="250" r="2.5"/><circle cx="380" cy="150" r="2"/></g>
</svg>
